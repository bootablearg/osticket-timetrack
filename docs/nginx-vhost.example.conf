# Example nginx vhost for osTicket 1.18.x
#
# The two blocks that matter for this plugin are marked below. Everything
# else is a plain osTicket setup — adjust paths, certificates and the PHP
# socket to your own.

server {
    listen 80;
    listen 443 ssl;
    server_name helpdesk.example.com;

    ssl_certificate     /etc/nginx/ssl/helpdesk.crt;
    ssl_certificate_key /etc/nginx/ssl/helpdesk.key;

    root  /var/www/osticket;
    index index.php index.html;

    client_max_body_size 25M;

    access_log /var/log/nginx/osticket-access.log;
    error_log  /var/log/nginx/osticket-error.log;

    # Never served
    location ~* ^/(include|setup/(inc|include))/ { deny all; }
    location ~* \.(sql|md|log|bak|orig|dist|zip|gz|tar|7z|sh)$ { deny all; }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location /scp/ {
        try_files $uri $uri/ /scp/index.php$is_args$args;
    }

    # ---- MATTERS ------------------------------------------------------
    # The REST API resolves through PATH_INFO: /api/tickets.json is
    # http.php with PATH_INFO=/tickets.json. try_files resets
    # $fastcgi_path_info, so the dispatcher answers "URL not supported"
    # with HTTP 400 — which breaks osTicket's own API too, not just this
    # plugin. Build it by hand instead.
    location ~ ^/api/(?<apipath>(?!http[.]php).*)$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/http.php;
        fastcgi_param SCRIPT_NAME /api/http.php;
        fastcgi_param PATH_INFO /$apipath;
        fastcgi_read_timeout 120;
    }

    # ---- MATTERS ------------------------------------------------------
    # (/|$) is not optional. With a plain \.php$ the request never enters
    # this block, because osTicket URLs end in /timetrack/ or /orgs/add,
    # not in .php. Symptom: modals show the whole portal inside them, and
    # the time report comes back blank.
    location ~ \.php(/|$) {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }
}
